[ssh]
host = 192.168.50.114
port = 22
user = goodls
local_bind_host = 127.0.0.1
local_port = 18789
remote_host = 127.0.0.1
remote_port = 18789
key_path = C:\Users\GoodLS\.ssh\openclaw_ed25519
known_hosts = C:\Users\GoodLS\.ssh\known_hosts
strict_host_key_checking = accept-new
connect_timeout = 10
server_alive_interval = 30
server_alive_count_max = 3
compression = false

[browser]
auto_open = true
url = http://127.0.0.1:18789
open_timeout = 10

[keygen]
key_type = ed25519
comment = openclaw-proxy

[app]
log_level = INFO
log_dir = logs


name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., 1.0.0)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  # ============================================
  # Windows 构建
  # ============================================
  build-windows:
    runs-on: windows-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt
      
      - name: Get version
        id: version
        run: |
          $version = python scripts/get_version.py
          echo "version=$version" >> $env:GITHUB_OUTPUT
          echo "Version: $version"
      
      - name: Build with PyInstaller
        run: |
          pyinstaller build.spec --clean
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: xia_proxy_win
          path: dist/xia_proxy_win.exe
          retention-days: 1

  # ============================================
  # macOS Intel 构建
  # ============================================
  build-macos-intel:
    runs-on: macos-13
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt
      
      - name: Get version
        id: version
        run: |
          version=$(python3 scripts/get_version.py)
          echo "version=$version" >> $GITHUB_OUTPUT
          echo "Version: $version"
      
      - name: Build with PyInstaller
        env:
          ARCH: x86_64
        run: |
          chmod +x scripts/build-macos.sh
          ./scripts/build-macos.sh
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: xia_proxy_macos-x86_64
          path: dist/xia_proxy_macos-x86_64
          retention-days: 1

  # ============================================
  # macOS Apple Silicon 构建
  # ============================================
  build-macos-arm:
    runs-on: macos-14
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt
      
      - name: Get version
        id: version
        run: |
          version=$(python3 scripts/get_version.py)
          echo "version=$version" >> $GITHUB_OUTPUT
          echo "Version: $version"
      
      - name: Build with PyInstaller
        env:
          ARCH: arm64
        run: |
          chmod +x scripts/build-macos.sh
          ./scripts/build-macos.sh
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: xia_proxy_macos-arm64
          path: dist/xia_proxy_macos-arm64
          retention-days: 1

  # ============================================
  # 创建 Release
  # ============================================
  release:
    needs: [build-windows, build-macos-intel, build-macos-arm]
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Get version info
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            # 从 tag 获取版本
            TAG="${GITHUB_REF#refs/tags/}"
            VERSION="${TAG#v}"
          else
            # 手动触发
            if [[ -n "${{ github.event.inputs.version }}" ]]; then
              VERSION="${{ github.event.inputs.version }}"
            else
              VERSION=$(python3 scripts/get_version.py)
            fi
            TAG="v${VERSION}"
          fi
          
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT
      
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: xia_proxy_win
          path: ./artifacts
      
      - name: Download macOS Intel artifact
        uses: actions/download-artifact@v4
        with:
          name: xia_proxy_macos-x86_64
          path: ./artifacts
      
      - name: Download macOS ARM artifact
        uses: actions/download-artifact@v4
        with:
          name: xia_proxy_macos-arm64
          path: ./artifacts
      
      - name: Generate Release Notes
        id: notes
        run: |
          # 获取上一个 tag
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          
          # 读取模板
          NOTES=$(cat .github/release-template.md)
          
          # 替换变量
          NOTES="${NOTES//\{VERSION\}/${{ steps.version.outputs.version }}}"
          NOTES="${NOTES//\{TAG\}/${{ steps.version.outputs.tag }}}"
          NOTES="${NOTES//\{DATE\}/${{ steps.version.outputs.date }}}"
          NOTES="${NOTES//\{PREVIOUS_TAG\}/$PREV_TAG}"
          
          # 生成变更日志
          if [[ -n "$PREV_TAG" ]]; then
            CHANGES=$(git log $PREV_TAG..HEAD --pretty=format:"- %s (%h)" --no-merges | head -20)
          else
            CHANGES=$(git log --pretty=format:"- %s (%h)" --no-merges | head -20)
          fi
          
          if [[ -z "$CHANGES" ]]; then
            CHANGES="- 初始发布"
          fi
          
          NOTES="${NOTES//\{CHANGES\}/$CHANGES}"
          
          # 保存到文件
          echo "$NOTES" > release_notes.md
          echo "notes_file=release_notes.md" >> $GITHUB_OUTPUT
      
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Release ${{ steps.version.outputs.version }}
          body_path: release_notes.md
          draft: false
          prerelease: false
          files: |
            artifacts/xia_proxy_win.exe
            artifacts/xia_proxy_macos-x86_64
            artifacts/xia_proxy_macos-arm64
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Summary
        run: |
          echo "## Release Created! 🎉" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version**: ${{ steps.version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "**Tag**: ${{ steps.version.outputs.tag }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Artifacts" >> $GITHUB_STEP_SUMMARY
          echo "- \`xia_proxy_win.exe\` - Windows 10/11 (64-bit)" >> $GITHUB_STEP_SUMMARY
          echo "- \`xia_proxy_macos-x86_64\` - macOS Intel" >> $GITHUB_STEP_SUMMARY
          echo "- \`xia_proxy_macos-arm64\` - macOS Apple Silicon (M1/M2/M3)" >> $GITHUB_STEP_SUMMARY
